#
# qmake configuration for linux-clang
#

MAKEFILE_GENERATOR = UNIX
CONFIG += incremental

QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/clang.conf)

QMAKE_LFLAGS += -ccc-gcc-name g++

# Включаем GNU-расширения (решает проблему asprintf в glibc для e2k)
DEFINES += _GNU_SOURCE

# Ослабляем проверки Clang 21 для кода C (xkbcommon, sqlite, libpng и др.)
QMAKE_CFLAGS += -D_GNU_SOURCE \
                -Wno-error=implicit-function-declaration \
                -Wno-error=incompatible-function-pointer-types \
                -Wno-error=int-conversion

# Фиксируем стандарт C++14 (в C++17 удалено слово register, которое есть в Qt 5.9)
QMAKE_CXXFLAGS += -std=gnu++14 \
                  -Wno-error=register \
                  -Wno-error=deprecated-declarations \
                  -Wno-error=incompatible-function-pointer-types

QMAKE_CC                = docker-e2k-run e2k-clang
QMAKE_CXX               = docker-e2k-run e2k-clang++

QMAKE_LINK_C            = $$QMAKE_CC
QMAKE_LINK_C_SHLIB      = $$QMAKE_CC

QMAKE_LINK              = $$QMAKE_CXX
QMAKE_LINK_SHLIB        = $$QMAKE_CXX

# у меня норовило вызвать llvm-ar пока не перебил явно
AR                      = e2k-linux-ar cqs
NM                      = e2k-linx-nm
RANLIB                  = true
QMAKE_AR                = e2k-ar cqs
QMAKE_NM                = e2k-nm -P
QMAKE_RANLIB            = true

# Wrapper tools that understand .o/.a files with LLVM bytecode instead of machine code
QMAKE_AR_LTCG           = e2k-ar cqs
QMAKE_NM_LTCG           = e2k-nm -P
QMAKE_RANLIB_LTCG       = true

load(qt_config)
